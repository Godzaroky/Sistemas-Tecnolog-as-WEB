<html lang="es">
<head>

    <title>Mi Perfil</title>

</head>
<body>

<h1>Tarjeta de Perfil</h1>

<button onclick="mostrarEtiquetas(habilidades)">

</button>

<button onclick="cargarUsuarios()">
    Cargar usuarios
</button>

<!-- ESTADO FETCH -->
<p id="estado"></p>

<!-- CONTENEDOR DE USUARIOS -->
 <div id="perfil">

    <h2 id="nombre"></h2>
    <p id="usuario"></p>
    <p id="email"></p>
    <p id="ciudad"></p>
</div>

<!-- CONTENEDOR DE HABILIDADES -->
<div>
    <h3>Habilidades:</h3>
    <div id="etiquetas"></div>
</div>

<script src="app.js"></script>

</body>
</html>
